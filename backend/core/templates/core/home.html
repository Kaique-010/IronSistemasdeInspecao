<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <title>Iron Sistema de Inspeção</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container py-5">

    <div class="text-center">

        <h1 class="display-3 fw-bold">
            Iron Sistema de Inspeção

        <p class="lead mt-4">

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card bg-secondary text-white h-100">

                <div class="card-body">

                    <h5>Multi-Tenant</h5>

                    <p>
                        Isolamento completo por banco de dados.
                    </p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-secondary text-white h-100">

                <div class="card-body">

                        YOLO, RT-DETR, Grounding DINO e novos modelos.
                    </p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-secondary text-white h-100">

                <div class="card-body">

                    <h5>IA + RAG</h5>

                    <p>
                        Embeddings, pgvector e Pipeline Inteligente.
                    </p>

                </div>

            </div>

        </div>

    </div>

    <div class="text-center mt-5">

        <a href="/admin/" class="btn btn-warning btn-lg">
